<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechBros – Digitales Schaufenster (Portrait 1080×1920)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090c;
  --bg2:#101319;
  --panel:#15181f;
  --line:rgba(255,255,255,.10);
  --fg:#f5f6f8;
  --fg-dim:#9aa1ad;
  --accent:#e82c31;          /* TechBros-Rot, exakt aus logo-quer.svg */
  --accent-2:#b81a21;        /* dunklere Variante für Verläufe */
  --accent-lite:#ff5a60;     /* aufgehellt: Rot-Text auf dunklem Grund */
  --logo-ink:#ffffff;        /* Monogramm + Claim (im Original schwarz) */
  --accent-ink:#ffffff;      /* Schrift auf dem Preisschild */
  --void:#000000;            /* Fläche neben der Bühne bei abweichendem Seitenverhältnis */
  --glow-a:rgba(232,44,49,.15);
  --glow-b:rgba(80,120,255,.10);
  --schatten:rgba(0,0,0,.62);
  --kante-innen:rgba(255,255,255,.06);
  --vignette:rgba(0,0,0,.55);
  --foto-schatten:rgba(0,0,0,.55);
  --badge-bg:rgba(8,9,12,.72);
  --badge-fg:var(--accent-lite);
  --bar-spur:rgba(255,255,255,.07);
  --blur-helligkeit:.5;
  --font:'Manrope',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --slide-ms:7000ms;
}
/* ---------- Helles Schaufenster-Thema ----------
   Im Fenster addiert das Glas die Spiegelung auf das, was der Bildschirm
   abstrahlt. Das Kontrastverhältnis bleibt dabei rechnerisch gleich, aber
   auf einer dunklen Fläche liegt das Spiegelbild auf Schwarz und ist voll
   sichtbar - der Bildschirm wird dort zum Spiegel. Eine helle, selbst
   leuchtende Fläche verdünnt es zum Schleier. Deshalb tagsüber hell.

   Aus demselben Grund entfällt hier der dunkle Weichzeichner hinter dem
   Produktbild: er kostet genau die Lichtmenge, die gegen die Spiegelung
   arbeiten soll. */
html.hell{
  --bg:#ffffff;
  --bg2:#f1f3f6;
  --panel:#ffffff;
  --line:rgba(0,0,0,.14);
  --fg:#0c0e12;
  --fg-dim:#5b626e;
  --accent-lite:#c8161c;     /* dunkleres Rot: auf Weiß muss es tragen */
  --logo-ink:#101216;
  --void:#e9eaee;
  --glow-a:rgba(232,44,49,.07);
  --glow-b:rgba(80,120,255,.05);
  --schatten:rgba(0,0,0,.16);
  --kante-innen:rgba(0,0,0,.03);
  --vignette:rgba(0,0,0,0);
  --foto-schatten:rgba(0,0,0,.20);
  --badge-bg:rgba(255,255,255,.88);
  --badge-fg:var(--accent-lite);
  --bar-spur:rgba(0,0,0,.10);
  --blur-helligkeit:1;
}
html.hell .blurbg,
html.hell .shade{display:none}          /* weiße Fläche statt Foto-Weichzeichner */

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;background:var(--void);
  font-family:var(--font);color:var(--fg);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;cursor:none;
}
img{-webkit-user-drag:none}

/* ---------- Skalierbare 1080x1920 Bühne ---------- */
#viewport{position:fixed;inset:0;background:var(--void);overflow:hidden}
#stage{
  position:absolute;top:0;left:0;
  width:1080px;height:1920px;
  transform-origin:top left;
  background:
    radial-gradient(1200px 900px at 78% -8%, var(--glow-a), transparent 62%),
    radial-gradient(1000px 800px at 10% 108%, var(--glow-b), transparent 60%),
    linear-gradient(178deg,var(--bg) 0%,var(--bg2) 55%,var(--bg) 100%);
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:170px 1fr auto 176px;
  padding:44px 56px 40px;
  gap:26px;
}

/* ---------- Kopfzeile ---------- */
#head{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;min-width:0}
/* Inline-SVG statt Bilddatei: so lassen sich Monogramm und Claim per CSS
   auf Weiß setzen (im Original sind sie schwarz und auf dunklem Grund
   unsichtbar) — keine weiße Plakette nötig, keine zweite HTTP-Anfrage. */
#logo{height:124px;width:auto;display:block;flex:0 0 auto;margin-right:22px}
#logo .lg-red{fill:var(--accent)}
#logo .lg-ink{fill:var(--logo-ink)}
#clock{text-align:right}
#clock b{display:block;font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
#clock span{display:block;font-size:21px;color:var(--fg-dim);letter-spacing:2.6px;text-transform:uppercase;margin-top:8px}

/* ---------- Medienfläche ---------- */
#media{
  position:relative;border-radius:38px;overflow:hidden;min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:0 40px 90px var(--schatten), inset 0 1px 0 var(--kante-innen);
}
.layer{position:absolute;inset:0;opacity:0;transition:opacity var(--fade,1100ms) ease}
.layer.on{opacity:1}
.blurbg{
  position:absolute;inset:-8%;
  background-size:cover;background-position:center;
  filter:blur(46px) saturate(135%) brightness(var(--blur-helligkeit));
  transform:scale(1.14);
}
.shade{position:absolute;inset:0;background:radial-gradient(75% 68% at 50% 42%,transparent 0%,var(--vignette) 100%)}
.photo{
  position:absolute;inset:44px;
  background-size:contain;background-position:center;background-repeat:no-repeat;
  filter:drop-shadow(0 26px 46px var(--foto-schatten));
  will-change:transform;
}
.layer.on .photo{animation:kenburns var(--kb,var(--slide-ms)) linear both}
@keyframes kenburns{from{transform:scale(1) translateY(0)}to{transform:scale(1.075) translateY(-14px)}}

#badges{position:absolute;top:34px;left:34px;z-index:3;display:flex;flex-direction:column;align-items:flex-start}
#badgeNeu{
  display:none;align-items:center;margin-bottom:14px;
  padding:16px 28px;border-radius:999px;
  background:var(--accent);color:#fff;
  font-size:25px;font-weight:800;letter-spacing:2.8px;text-transform:uppercase;
  box-shadow:0 10px 30px rgba(226,38,46,.45);
}
#badgeNeu.on{display:inline-flex}
#badge{
  display:inline-flex;align-items:center;
  padding:16px 28px;border-radius:999px;
  background:var(--badge-bg);backdrop-filter:blur(14px);
  border:1px solid rgba(226,38,46,.70);
  color:var(--badge-fg);font-size:25px;font-weight:800;
  letter-spacing:2.8px;text-transform:uppercase;
}
#badge::before{content:"";width:12px;height:12px;flex:0 0 12px;margin-right:12px;border-radius:50%;background:var(--badge-fg);box-shadow:0 0 14px var(--accent)}

/* ---------- Textblock ---------- */
/* Abstaende bewusst als margin, nicht als flex-gap: aeltere TV-Browser
   (Chromium < 84) ignorieren gap in Flex-Containern stillschweigend. */
#info{display:flex;flex-direction:column;justify-content:flex-start;min-height:0;min-width:0}
#kicker{font-size:23px;letter-spacing:4.2px;text-transform:uppercase;color:var(--fg-dim);margin-bottom:30px}
#title{
  font-size:64px;font-weight:800;line-height:1.1;letter-spacing:-1.2px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
#priceRow{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:end;column-gap:26px;margin-top:28px;min-width:0;
}
#priceAlt{
  display:none;font-size:34px;font-weight:700;color:rgba(255,255,255,.78);
  text-decoration:line-through;text-decoration-thickness:3px;margin-bottom:4px;
}
#priceAlt.on{display:block}
#priceZeile{display:flex;align-items:baseline}
#price{
  display:inline-flex;flex-direction:column;align-items:flex-start;
  padding:20px 46px 26px;border-radius:30px;
  background:linear-gradient(160deg,var(--accent),var(--accent-2));
  color:var(--accent-ink);
  box-shadow:0 26px 60px rgba(226,38,46,.34);
}
#price .amount{font-size:132px;font-weight:800;line-height:.92;letter-spacing:-4px;font-variant-numeric:tabular-nums}
#price .amount.txt{font-size:56px;letter-spacing:-1.2px;line-height:1.05;white-space:nowrap}
#price .cur{font-size:66px;font-weight:800;line-height:1;margin-left:16px}
#price .vb{font-size:36px;font-weight:800;opacity:.80;letter-spacing:1px;margin-left:16px}
#ctaTxt{text-align:right;min-width:0;padding-bottom:10px;overflow:hidden}
#ctaTxt.knapp b{display:none}          /* enge Spalte: nur der QR-Hinweis bleibt */
#ctaTxt.aus{visibility:hidden}
#ctaTxt b{display:block;font-size:26px;font-weight:800;letter-spacing:-.2px}
#ctaTxt span{display:block;font-size:19px;color:var(--badge-fg);letter-spacing:2px;text-transform:uppercase;margin-top:8px}
/* QR fest als Inline-SVG: das Ziel ändert sich nie, also braucht es dafür
   weder eine Bibliothek zur Laufzeit noch einen externen Dienst. Weiße
   Fläche und Ruhezone stecken im SVG - beides ist Voraussetzung dafür, dass
   Handykameras den Code aus einigen Metern Entfernung erfassen. */
#qr{width:186px;height:186px;flex:0 0 186px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 12px 34px var(--schatten)}
#qr svg{display:block;width:100%;height:100%}

/* ---------- Fußzeile ---------- */
/* Platz für optionalen QR-Code: <img id="qr" src="..."> hier einsetzen
#qr{width:104px;height:104px;border-radius:14px;background:#fff;padding:8px} */

#dbg{
  position:fixed;top:0;left:0;z-index:9999;display:none;
  background:#000;color:#0f0;font:16px/1.5 monospace;padding:14px 18px;
  border:2px solid #0f0;white-space:pre;
}
#dbg.on{display:block}
/* Laufband: zwei identische Haelften, die Animation schiebt um genau 50 % -
   dadurch laeuft der Text ohne sichtbaren Sprung endlos weiter. */
/* Laufband, zwei Zeilen: oben die feste Aussage, darunter die Warengruppen
   im Durchlauf. Zwei identische Haelften, die Animation schiebt um genau
   50 % - dadurch laeuft der Text ohne sichtbaren Sprung endlos weiter. */
#ticker{
  display:flex;flex-direction:column;justify-content:center;
  border-top:1px solid var(--line);padding-top:22px;overflow:hidden;
}
#tickerKopf{
  white-space:nowrap;line-height:1.1;margin-bottom:16px;
}
#tickerKopf span{
  display:inline-block;
  font-size:44px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--badge-fg);
}
#tickerLauf{overflow:hidden}
#tickerTrack{display:flex;white-space:nowrap;will-change:transform;
  animation:tick var(--tick,60s) linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{display:inline-block;font-size:38px;font-weight:800;letter-spacing:.4px;color:var(--fg)}
.tk i{color:var(--accent);font-style:normal;padding:0 26px}
#bar{position:absolute;left:0;bottom:0;height:7px;width:100%;background:var(--bar-spur)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ff8f93);box-shadow:0 0 18px rgba(226,38,46,.75)}
</style>

/* ============================================================
   AUFBEREITUNG
   ============================================================ */
const imgUrl = v => v.startsWith('http')
  ? (v.includes('?') ? v : v + '?rule=' + CONFIG.IMG_RULE)   // volle URL aus ads.json
  : IMG_BASE + v + '?rule=' + CONFIG.IMG_RULE;               // kurze ID aus der Fallback-Liste

function isAnkauf(a){ return !/\d/.test(a.p) && /ankauf|verkaufen/i.test(a.t); }

// Unicode-Property-Escapes (\p{...}) kennen aeltere TV-Browser nicht. Als
// Literal geschrieben wuerde die Datei dort gar nicht erst geparst und die
// Seite bliebe schwarz - deshalb zur Laufzeit bauen, mit einfacherem Ersatz.
const RE_DEKO = (function(){
  try { return new RegExp('[\\p{Extended_Pictographic}\\uFE0F\\u2B00-\\u2BFF]', 'gu'); }
  catch (e) { return /[\u2190-\u2BFF\u2600-\u27BF\uFE0F\uD800-\uDFFF]/g; }
})();

// Deko-Emoji entfernen, "TOP ANGEBOT" wandert ins Badge
function cleanTitle(raw){
  let s = raw.replace(RE_DEKO, ' ');
  s = s.replace(/\bTOP\s*ANGEBOT\b/gi, ' ').replace(/^\s*TOP\b/i, ' ');
  s = s.replace(/\s{2,}/g, ' ').trim();
  s = s.replace(/^[|\-–•·,:]+\s*/, '').replace(/\s*[|\-–•·,:]+$/, '').trim();
  return s || raw.trim();
}

// Anzeigenalter in Tagen aus dem vom Scraper gesetzten ISO-Datum.
// Die Fallback-Liste kennt kein ts - dort gibt es dann kein Neu-Badge.
function alterTage(a){
  if (!a.ts) return null;
  const t = Date.parse(a.ts + 'T00:00:00');
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}

function istNeu(a){
  const d = alterTage(a);
  return d !== null && d <= CONFIG.NEU_TAGE;
}

// Aus "Kamera Ankauf Berlin | Canon Sony Nikon verkaufen" wird "Kamera":
// alles vor dem ersten Ankauf-/Verkaufs-Wort ist das Thema.
function thema(titel){
  let s = cleanTitle(titel).split(/\b(?:ankaufspreise|ankauf|verkaufen|verkauf)\b/i)[0];
  return s.replace(/\s{2,}/g, ' ').replace(/[|\-–•·,:]+\s*$/, '').trim();
}

function themenListe(ankaufAnzeigen){
  const roh = ankaufAnzeigen.map(a => thema(a.t)).filter(Boolean);
  const out = [];
  roh.forEach(t => {
    if (out.some(v => v.toLowerCase() === t.toLowerCase())) return;
    // "iPhone 17" faellt weg, wenn "iPhone" schon in der Liste steht.
    if (out.some(v => t.toLowerCase().startsWith(v.toLowerCase() + ' '))) return;
    out.push(t);
  });
  // Umgekehrter Fall: spaeter kam das kuerzere Thema dazu.
  return out.filter((t, i) =>
    !out.some((v, j) => j !== i && t.toLowerCase().startsWith(v.toLowerCase() + ' ')));
}

function badgeFor(a){
  const T = a.t.toUpperCase();
  if (isAnkauf(a))                              return 'Ankauf · Sofort Bargeld';
  if (/VERSIEGELT|NAGELNEU/.test(T))            return 'Neu & versiegelt';
  if (/\bNEU\b/.test(T))                        return 'Neuware';
  if (/\bOVP\b/.test(T) && !/OHNE OVP/.test(T)) return 'Mit Originalverpackung';
  if (/TOP ANGEBOT/.test(T))                    return 'Top Angebot';
  if (/TOP ZUSTAND|WIE NEU/.test(T))            return 'Top Zustand';
  return 'Sofort verfügbar';
}

// "1.299 €" -> {amount:'1.299', cur:'€'} | "150 € VB" -> + vb | "VB" -> Textmodus
function parsePrice(a){
  if (isAnkauf(a)) return {text:'Preis auf Anfrage'};
  const m = a.p.match(/([\d.]+)\s*€/);
  if (!m) return {text: a.p && a.p !== 'VB' ? a.p : 'Preis auf Anfrage'};
  return {amount:m[1], cur:'€', vb:/\bVB\b/i.test(a.p)};
}

// Bilder einer Anzeige: der Scraper liefert imgs, die Fallback-Liste nur das
// Aufmacherbild.
function bilderVon(a){
  const roh = (a.imgs && a.imgs.length) ? a.imgs : [a.i];
  return roh.slice(0, Math.max(1, CONFIG.MAX_BILDER)).map(imgUrl);
}

let ankaufThemen = [];

// Ankauf-Anzeigen gleichmäßig zwischen die Produkte legen. Die Positionen
// werden über die ganze Liste verteilt berechnet, damit zwischen zwei
// Ankauf-Anzeigen immer mehrere Produkte liegen; die Reihenfolge der
// Ankauf-Anzeigen selbst ist gemischt, sodass der Durchlauf nicht jeden Tag
// gleich aussieht.
function verteile(produkte, ankauf){
  if (!ankauf.length) return produkte;
  if (!produkte.length) return ankauf;

  const misch = ankauf.slice().sort(() => Math.random() - .5);
  const stellen = new Set();
  for (let j = 1; j <= misch.length; j++){
    stellen.add(Math.round(j * produkte.length / (misch.length + 1)));
  }

  const out = [];
  let k = 0;
  produkte.forEach((p, i) => {
    out.push(p);
    if (k < misch.length && stellen.has(i + 1)) out.push(misch[k++]);
  });
  while (k < misch.length) out.push(misch[k++]);   // falls Stellen zusammenfielen
  return out;
}

function build(list){
  const produkte = [], ankauf = [];
  list.forEach(a => (isAnkauf(a) ? ankauf : produkte).push(a));
  ankaufThemen = themenListe(ankauf);

  const quelle = CONFIG.ANKAUF === 'gemischt' ? verteile(produkte, ankauf) : produkte;
  const out = quelle.map(a => ({
    title: cleanTitle(a.t),
    badge: badgeFor(a),
    neu:   istNeu(a),
    price: parsePrice(a),
    alt:   a.p_alt || '',
    imgs:  bilderVon(a),
    ankauf: isAnkauf(a)
  }));
  if (CONFIG.SHUFFLE) out.sort(() => Math.random() - .5);
  return out.length ? out : build2(list);
}

// Notnagel: filtert die Anzeigenart alles weg, laufen lieber alle Anzeigen
// als ein leeres Schaufenster.
function build2(list){
  return list.map(a => ({
    title: cleanTitle(a.t), badge: badgeFor(a), neu: istNeu(a),
    price: parsePrice(a), alt: a.p_alt || '', imgs: bilderVon(a), ankauf: isAnkauf(a)
  }));
}

let items = build(ADS);

/* ============================================================
   LIVE-DATEN — ads.json vom Scraper, mit Rückfall auf die eingebaute Liste
   ============================================================ */
async function loadAds(){
  if (!CONFIG.DATA_URL) return;
  try {
    const r = await fetch(CONFIG.DATA_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const list = Array.isArray(j) ? j : j.ads;
    // Plausibilitätsprüfung: eine leere oder verstümmelte Datei darf die
    // laufende Anzeige nicht leeren.
    if (!Array.isArray(list) || list.length < 3) throw new Error('zu wenige Anzeigen');
    if (!list.every(a => a && a.t && a.i))        throw new Error('Felder fehlen');
    const next = build(list);
    if (!next.length) throw new Error('nach Filter leer');
    items = next;
    if (idx >= items.length) idx = items.length - 1;
    laufband();
  } catch (e) {
    console.warn('[signage] ads.json nicht nutzbar, Fallback-Liste bleibt aktiv:', e.message);
  }
}

/* ============================================================
   1080x1920-Bühne auf jede Portrait-Auflösung skalieren
   ============================================================ */
const stage = document.getElementById('stage');

function rotation(){
  if (CONFIG.ROTATE === 'auto') return innerWidth > innerHeight ? 90 : 0;
  const n = parseInt(CONFIG.ROTATE, 10);
  return (n === 90 || n === 270) ? n : 0;
}

function fit(){
  const rot  = rotation();
  const trim = 1 - (CONFIG.OVERSCAN_PCT || 0) / 100;
  let t;

  if (rot === 0){
    const s = Math.min(innerWidth / 1080, innerHeight / 1920) * trim;
    t = 'translate(' + ((innerWidth - 1080 * s) / 2) + 'px,'
                     + ((innerHeight - 1920 * s) / 2) + 'px) scale(' + s + ')';
  } else {
    // Gedreht belegt die 1080x1920-Buehne 1920 breit und 1080 hoch.
    const s  = Math.min(innerWidth / 1920, innerHeight / 1080) * trim;
    const ox = (innerWidth  - 1920 * s) / 2;
    const oy = (innerHeight - 1080 * s) / 2;
    t = rot === 90
      ? 'translate(' + (ox + 1920 * s) + 'px,' + oy + 'px) rotate(90deg) scale(' + s + ')'
      : 'translate(' + ox + 'px,' + (oy + 1080 * s) + 'px) rotate(-90deg) scale(' + s + ')';
  }
  stage.style.transform = t;

  const dbg = document.getElementById('dbg');
  if (dbg.classList.contains('on')){
    const fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    dbg.textContent =
      'BUILD    ' + BUILD + '\n' +
      'Fenster  ' + innerWidth + ' x ' + innerHeight + '\n' +
      'Schirm   ' + screen.width + ' x ' + screen.height + '\n' +
      'Pixel    ' + devicePixelRatio + '\n' +
      'Drehung  ' + rot + ' Grad\n' +
      'Thema    ' + (document.documentElement.classList.contains('hell') ? 'hell' : 'dunkel')
                  + ' (' + CONFIG.THEMA + ')\n' +
      'Vollbild ' + (fs ? 'ja' : 'nein') + '\n' +
      'Transform\n  ' + t;
  }
}
addEventListener('resize', fit);
addEventListener('orientationchange', fit);

// Diagnose mit ?debug=1 an die Adresse anhaengen.
if (location.search.indexOf('debug') > -1){
  document.getElementById('dbg').classList.add('on');
}

// TV-Browser starten nie im Vollbild. Die Fullscreen-API darf nur aus einer
// Nutzeraktion heraus ausgeloest werden - ein Druck auf OK oder ein Klick
// genuegt, danach bleibt es bis zum Verlassen der Seite bestehen.
function goFullscreen(){
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen
          || el.mozRequestFullScreen || el.msRequestFullscreen;
  const aktiv = document.fullscreenElement || document.webkitFullscreenElement;
  if (fn && !aktiv){ try { fn.call(el); } catch (e) {} }
}
addEventListener('click', goFullscreen);
addEventListener('keydown', goFullscreen);
addEventListener('fullscreenchange', fit);
addEventListener('webkitfullscreenchange', fit);

fit();

/* ============================================================
   KARUSSELL — Endlosschleife, Crossfade, Bild-Vorladen
   ============================================================ */
const layers = [document.getElementById('lA'), document.getElementById('lB')];
const elBadgeNeu = document.getElementById('badgeNeu');
const elAlt   = document.getElementById('priceAlt');
const elCtaTxt= document.getElementById('ctaTxt');
const elTrack = document.getElementById('tickerTrack');
const elTitle = document.getElementById('title');
const elBadge = document.getElementById('badge');
const elPrice = document.getElementById('price');
const elKick  = document.getElementById('kicker');
const elCount = document.getElementById('count');   // entfällt seit die Fußzeile weg ist
const elBar   = document.querySelector('#bar i');

document.documentElement.style.setProperty('--slide-ms', CONFIG.SLIDE_MS + 'ms');

let idx = -1, front = 0, bildTimer = null;

// Laufband aus den Themen der Ankauf-Anzeigen. Zwei identische Haelften,
// damit die 50-%-Verschiebung nahtlos umschlaegt; die Dauer richtet sich nach
// der Textbreite, sonst laeuft kurzer Text zu schnell und langer zu langsam.
// Der Kopftext soll in CONFIG frei änderbar sein. Statt einer fest
// gewählten Schriftgröße, die beim nächsten Wortwechsel umbricht, wird sie so
// weit verkleinert, bis die Zeile in die Breite passt.
function laufbandKopf(){
  const box = document.getElementById('tickerKopf');
  const sp  = box.firstElementChild;
  sp.textContent = CONFIG.LAUFBAND_KOPF;
  for (let px = 44; px >= 24; px -= 2){
    sp.style.fontSize = px + 'px';
    if (sp.offsetWidth <= box.clientWidth) break;
  }
}

function laufband(){
  laufbandKopf();
  if (!ankaufThemen.length){ elTrack.innerHTML = ''; return; }
  const haelfte = '<span class="tk">'
                + ankaufThemen.map(t => t + '<i>•</i>').join('')
                + '</span>';
  elTrack.innerHTML = haelfte + haelfte;
  requestAnimationFrame(() => {
    const breite = elTrack.scrollWidth / 2;            // eine Hälfte
    const sek = Math.max(20, Math.round(breite / 90)); // rund 90 px je Sekunde
    elTrack.style.setProperty('--tick', sek + 's');
  });
}

// Liefert die URL zurück, wenn das Bild lädt, sonst null. Einzelne Bilder
// sind bei Kleinanzeigen verwaist; ein toter Link darf keine leere Fläche
// hinterlassen. Der Scraper siebt sie bereits aus, das hier fängt die Fälle
// ab, die zwischen zwei Läufen verschwinden.
function preload(url){
  return new Promise(res => {
    const im = new Image();
    let done = false;
    const finish = v => { if (!done) { done = true; res(v); } };
    im.onload  = () => finish(url);
    im.onerror = () => finish(null);
    im.src = url;
    setTimeout(() => finish(null), 6000); // nie am Netz hängenbleiben
  });
}

// Erstes ladbares Bild einer Anzeige.
async function ersteBild(liste){
  for (let k = 0; k < liste.length; k++){
    const u = await preload(liste[k]);
    if (u) return u;
  }
  return null;
}

function renderPrice(p){
  const z = document.getElementById('priceZeile');
  if (p.text) { z.innerHTML = '<span class="amount txt"></span>';
                z.firstChild.textContent = p.text; return; }
  z.innerHTML =
    '<span class="amount"></span><span class="cur">€</span>' + (p.vb ? '<span class="vb">VB</span>' : '');
  z.querySelector('.amount').textContent = p.amount;
}

function zeigeBild(url, dauer){
  const back = layers[1 - front];
  back.querySelector('.blurbg').style.backgroundImage = 'url("' + url + '")';
  const ph = back.querySelector('.photo');
  ph.style.backgroundImage = 'url("' + url + '")';

  // Ken-Burns-Animation für die einblendende Ebene neu starten
  ph.style.animation = 'none'; void ph.offsetWidth; ph.style.animation = '';
  ph.style.setProperty('--kb', dauer + 'ms');

  back.classList.add('on');
  layers[front].classList.remove('on');
  front = 1 - front;
}

// Vierstellige Preise und "Preis auf Anfrage" machen das Preisschild so
// breit, dass für den Begleittext kaum Platz bleibt. Er würde dann auf fünf
// gequetschte Zeilen umbrechen, deshalb zwei Stufen: erst fällt die
// Überschrift weg, dann der ganze Block. Der QR-Code hat eine eigene Spalte
// fester Breite und bleibt in jedem Fall vollständig sichtbar.
function ctaAnpassen(){
  elCtaTxt.classList.remove('knapp', 'aus');
  const b = elCtaTxt.clientWidth;
  if (b < 300) elCtaTxt.classList.add('knapp');   // Überschrift weg
  if (b < 150) elCtaTxt.classList.add('aus');     // gar kein Platz mehr
}

async function show(n){
  const it = items[n];
  clearInterval(bildTimer);

  // Mehrere Bilder teilen sich die Standzeit des Slides. Die Überblendung
  // muss dann kürzer sein, sonst blendet es noch, während schon gewechselt wird.
  const dauer = Math.round(CONFIG.SLIDE_MS / it.imgs.length);
  document.documentElement.style.setProperty(
    '--fade', Math.min(1100, Math.round(dauer * 0.35)) + 'ms');

  const erste = await ersteBild(it.imgs);
  // Lädt kein einziges Bild, bleibt das vorherige stehen statt einer
  // schwarzen Fläche - Text und Preis wechseln trotzdem.
  if (erste) zeigeBild(erste, dauer);

  if (it.imgs.length > 1){
    const rest = await Promise.all(it.imgs.filter(u => u !== erste).map(preload));
    const liste = (erste ? [erste] : []).concat(rest.filter(Boolean));
    if (liste.length > 1){
      let b = 0;
      bildTimer = setInterval(function(){
        b = (b + 1) % liste.length;
        zeigeBild(liste[b], dauer);
      }, dauer);
    }
  }

  elTitle.textContent = it.title;
  elBadge.textContent = it.badge;
  elBadgeNeu.classList.toggle('on', !!it.neu);
  elKick.textContent  = it.ankauf ? 'Wir kaufen an' : 'Aktuelles Angebot';
  renderPrice(it.price);
  elAlt.textContent = it.alt ? 'statt ' + it.alt : '';
  elAlt.classList.toggle('on', !!it.alt);
  ctaAnpassen();
  if (elCount) elCount.textContent = 'Anzeige ' + (n + 1) + ' / ' + items.length;

  // Fortschrittsbalken
  elBar.style.transition = 'none';  elBar.style.width = '0%';
  void elBar.offsetWidth;
  elBar.style.transition = 'width ' + CONFIG.SLIDE_MS + 'ms linear';
  elBar.style.width = '100%';

  preload(items[(n + 1) % items.length].imgs[0]); // nächste Anzeige vorbereiten
}

function tick(){
  idx = (idx + 1) % items.length;   // Modulo = echte Endlosschleife
  show(idx);
}
loadAds().then(() => {
  laufband();
  tick();
  setInterval(tick, CONFIG.SLIDE_MS);
  if (CONFIG.DATA_REFRESH_MIN > 0){
    setInterval(loadAds, CONFIG.DATA_REFRESH_MIN * 60 * 1000);
  }
});

/* ---------- Farbschema nach Tageszeit ---------- */
function themaAnwenden(){
  let hell;
  if (CONFIG.THEMA === 'hell')        hell = true;
  else if (CONFIG.THEMA === 'dunkel') hell = false;
  else {
    const h = new Date().getHours();
    // Der Vergleich muss auch dann stimmen, wenn die helle Phase über
    // Mitternacht laufen soll (HELL_AB größer als DUNKEL_AB).
    hell = CONFIG.HELL_AB <= CONFIG.DUNKEL_AB
      ? (h >= CONFIG.HELL_AB && h < CONFIG.DUNKEL_AB)
      : (h >= CONFIG.HELL_AB || h < CONFIG.DUNKEL_AB);
  }
  const vorher = document.documentElement.classList.contains('hell');
  document.documentElement.classList.toggle('hell', hell);
  // fit() schreibt die Diagnosezeile. Ohne diesen Aufruf zeigte sie den
  // Stand von vor dem Themenwechsel - eine Diagnose, die falsch informiert,
  // ist schlechter als gar keine.
  if (vorher !== hell || !themaGesetzt) { themaGesetzt = true; fit(); }
}
let themaGesetzt = false;
themaAnwenden();

const elClock = document.querySelector('#clock b');
function clock(){
  elClock.textContent = new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
  themaAnwenden();          // gleicher Takt, kein zweiter Zeitgeber nötig
}
clock(); setInterval(clock, 15000);

/* ---------- 24/7-Stabilität: periodischer Reload ---------- */
if (CONFIG.RELOAD_AFTER_H > 0){
  setTimeout(() => location.reload(), CONFIG.RELOAD_AFTER_H * 3600 * 1000);
}
</script>
